name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 18            # matches your Dockerfiles (node:18-alpine)
  BACKEND_IMAGE: mern-backend
  FRONTEND_IMAGE: mern-frontend

jobs:
  # ---------------------------------------------------------------
  # CI 1: Backend - install deps and run tests against a real MongoDB
  # ---------------------------------------------------------------
  backend-ci:
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/todo_test
      JWT_SECRET: ci_test_secret   # backend/.env is gitignored, so set env here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --passWithNoTests keeps the job green until you add test files
      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit

  # ---------------------------------------------------------------
  # CI 2: Frontend - lint and build
  # ---------------------------------------------------------------
  frontend-ci:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------
  # CI 3: Integration - run the whole stack with docker compose
  # ---------------------------------------------------------------
  docker-compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for backend API
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/tasks > /dev/null; then
              echo "Backend is up"; exit 0
            fi
            echo "Waiting for backend... ($i/30)"; sleep 3
          done
          echo "Backend did not become healthy"; exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "Frontend is up"; exit 0
            fi
            echo "Waiting for frontend... ($i/40)"; sleep 3
          done
          echo "Frontend did not become healthy"; exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------
  # CD: Build and push Docker images to Docker Hub (main branch only)
  # ---------------------------------------------------------------
  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: docker-compose-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # CD: Deploy the new images to the AWS EC2 server over SSH
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Create app folder on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/app

      - name: Pull new images and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,JWT_SECRET
          script: |
            cd /home/ubuntu/app
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Check the live app
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://${{ secrets.SERVER_HOST }}:5000/api/tasks > /dev/null; then
              echo "Backend is live"; exit 0
            fi
            echo "Waiting for live backend... ($i/30)"; sleep 4
          done
          echo "Live backend did not respond"; exit 1