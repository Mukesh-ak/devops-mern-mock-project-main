# Used on the AWS server. Pulls ready-made images from Docker Hub.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db        # keeps your data after restarts

  backend:
    image: ${DOCKERHUB_USERNAME}/mern-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/todo
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    image: ${DOCKERHUB_USERNAME}/mern-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data: